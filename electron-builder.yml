appId: com.lumen.editor
productName: Lumen Editor
directories:
  buildResources: build
  output: release/${version}
files:
  - out/**/*
  - package.json
asar: true
fileAssociations:
  - ext:
      - txt
      - md
      - markdown
      - json
      - js
      - ts
      - html
      - css
      - py
      - java
      - c
      - cpp
      - h
      - hpp
      - go
      - rs
      - sh
    name: Lumen Editor Document
    role: Editor
win:
  target:
    - nsis
    - portable
  artifactName: ${productName}-${version}-win-${arch}.${ext}
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
mac:
  target:
    - dmg
    - zip
  category: public.app-category.developer-tools
  artifactName: ${productName}-${version}-mac-${arch}.${ext}
  # Provide CSC_LINK / CSC_KEY_PASSWORD in release CI to sign with a Developer
  # ID certificate. Set APPLE_ID / APPLE_APP_SPECIFIC_PASSWORD / APPLE_TEAM_ID
  # there as well to enable electron-builder's notarization flow.
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
linux:
  target:
    - AppImage
    - deb
  category: Utility
  artifactName: ${productName}-${version}-linux-${arch}.${ext}
