name: Release

on:
  push:
    tags:
      - "v*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  NODE_VERSION: "20"

jobs:
  validate:
    name: Validate release
    runs-on: ubuntu-22.04
    steps:
      - name: Check out the tagged source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          fetch-depth: 0
          fetch-tags: true
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Match tag to package version
        run: node scripts/release-artifacts.mjs verify-tag "${GITHUB_REF_NAME}"
      - name: Match native bundle version to package version
        run: |
          set -euo pipefail
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          PLIST_VERSION="$(python3 -c 'import plistlib; print(plistlib.load(open("native-macos/Packaging/Info.plist", "rb"))["CFBundleShortVersionString"])')"
          if [ "$PLIST_VERSION" != "$PACKAGE_VERSION" ]; then
            echo "Native Info.plist version $PLIST_VERSION does not match package version $PACKAGE_VERSION." >&2
            exit 1
          fi
      - name: Require the tagged commit to be on main
        run: |
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || {
            echo "Release tag $GITHUB_REF_NAME is not reachable from main." >&2
            exit 1
          }
      - name: Install locked dependencies
        run: npm ci
      - name: Test, type-check, and build
        run: npm test

  build-linux:
    name: Linux x64
    needs: validate
    runs-on: ubuntu-22.04
    steps:
      - name: Check out the tagged source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Package AppImage and Debian package
        run: npx --no-install electron-builder --linux --x64 --publish never
      - name: Validate and stage Linux files
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          APPIMAGE="release/$VERSION/text-editor-xujieyang-$VERSION-linux-x86_64.AppImage"
          DEB="release/$VERSION/text-editor-xujieyang-$VERSION-linux-amd64.deb"
          test -s "$APPIMAGE"
          test -x "$APPIMAGE"
          test -s "$DEB"
          dpkg-deb --info "$DEB" >/dev/null
          node scripts/release-artifacts.mjs stage linux-x64
      - name: Upload Linux release files
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-linux-x64
          path: release-assets/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  build-macos:
    name: macOS ${{ matrix.arch }}
    needs: validate
    environment: production-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: macos-15-intel
          - arch: arm64
            runner: macos-15
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Check out the tagged source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Require Apple signing and notarization credentials
        env:
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.MAC_APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.MAC_APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.MAC_APPLE_TEAM_ID }}
        run: |
          for name in CSC_LINK CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID; do
            if [ -z "${!name:-}" ]; then
              echo "Missing $name in the production-release environment." >&2
              exit 1
            fi
          done
      - name: Import Developer ID certificate into a job-scoped keychain
        env:
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          keychain="$RUNNER_TEMP/lumen-release-${GITHUB_RUN_ID}-${{ matrix.arch }}.keychain-db"
          keychain_password="$(openssl rand -hex 32)"
          certificate="$RUNNER_TEMP/lumen-release-${GITHUB_RUN_ID}-${{ matrix.arch }}.p12"
          original_keychains="$RUNNER_TEMP/lumen-release-${GITHUB_RUN_ID}-${{ matrix.arch }}-keychains.txt"
          security list-keychains -d user > "$original_keychains"
          if [[ "$CSC_LINK" == https://* ]]; then
            curl --fail-with-body --silent --show-error --location \
              --proto '=https' --proto-redir '=https' --tlsv1.2 \
              --output "$certificate" "$CSC_LINK"
          elif [[ "$CSC_LINK" == file://* ]]; then
            cp -- "${CSC_LINK#file://}" "$certificate"
          elif [ -f "$CSC_LINK" ]; then
            cp -- "$CSC_LINK" "$certificate"
          else
            printf '%s' "$CSC_LINK" | openssl base64 -d -A -out "$certificate"
          fi
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$certificate" -k "$keychain" \
            -P "$CSC_KEY_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -s \
            -k "$keychain_password" "$keychain"
          security list-keychains -d user -s "$keychain"
          identity="$(security find-identity -v -p codesigning "$keychain" | sed -n 's/.*"\(Developer ID Application:.*\)"/\1/p' | head -n 1)"
          if [ -z "$identity" ]; then
            echo "The imported Developer ID Application identity was not found." >&2
            exit 1
          fi
          echo "CSC_NAME=${identity#Developer ID Application: }" >> "$GITHUB_ENV"
          echo "DEVELOPER_ID_APPLICATION=$identity" >> "$GITHUB_ENV"
          echo "CSC_KEYCHAIN=$keychain" >> "$GITHUB_ENV"
          rm -f -- "$certificate"
      - name: Install locked dependencies
        run: npm ci
      - name: Verify committed native parser bundle
        run: npm run check:native-parser
      - run: npm run build
      - name: Package signed and notarized macOS files
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "true"
          # The certificate is already on the user keychain search list. Do not
          # give electron-builder ownership of the native packager's keychain:
          # electron-builder deletes any CSC_KEYCHAIN when its build finishes.
          CSC_KEYCHAIN: ""
          APPLE_ID: ${{ secrets.MAC_APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.MAC_APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.MAC_APPLE_TEAM_ID }}
        run: |
          npx --no-install electron-builder --mac --${{ matrix.arch }} --publish never \
            --config.forceCodeSigning=true \
            --config.mac.notarize.teamId="$APPLE_TEAM_ID"
      - name: Test and package signed, notarized native macOS files
        env:
          VERSION: ${{ github.ref_name }}
          BUILD_NUMBER: ${{ github.run_number }}
          ARCHITECTURE: ${{ matrix.arch }}
          APPLE_ID: ${{ secrets.MAC_APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.MAC_APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.MAC_APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          bash native-macos/scripts/verify.sh
          VERSION="${VERSION#v}" bash native-macos/scripts/package-release.sh
      - name: Verify Developer ID signature, notarization, DMG, and ZIP
        env:
          RELEASE_ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./package.json').version")"
          OUTPUT="release/$VERSION"
          EVIDENCE_DIR="$RUNNER_TEMP/native-macos-release-evidence-$RELEASE_ARCH"
          mkdir -p "$EVIDENCE_DIR"
          DMG="$OUTPUT/text-editor-xujieyang-$VERSION-macos-$RELEASE_ARCH.dmg"
          ZIP="$OUTPUT/text-editor-xujieyang-$VERSION-macos-$RELEASE_ARCH.zip"
          NATIVE_DMG="$OUTPUT/text-editor-xujieyang-$VERSION-native-macos-$RELEASE_ARCH.dmg"
          NATIVE_ZIP="$OUTPUT/text-editor-xujieyang-$VERSION-native-macos-$RELEASE_ARCH.zip"
          test -s "$DMG"
          test -s "$ZIP"
          test -s "$NATIVE_DMG"
          test -s "$NATIVE_ZIP"

          verify_app() {
            local app_path="$1"
            local expected_arch="$2"
            local executable icon_file candidate architectures macho_count=0
            test -d "$app_path"
            executable="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$app_path/Contents/Info.plist")"
            test -x "$app_path/Contents/MacOS/$executable"
            while IFS= read -r -d '' candidate; do
              if file -b "$candidate" | grep -q 'Mach-O'; then
                architectures="$(lipo -archs "$candidate")"
                if [ "$architectures" != "$expected_arch" ]; then
                  echo "Expected $candidate to contain only $expected_arch, found: $architectures" >&2
                  return 1
                fi
                macho_count=$((macho_count + 1))
              fi
            done < <(find "$app_path" -type f -perm -111 -print0)
            test "$macho_count" -gt 0
            icon_file="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIconFile' "$app_path/Contents/Info.plist")"
            case "$icon_file" in *.icns) ;; *) icon_file="$icon_file.icns" ;; esac
            test -s "$app_path/Contents/Resources/$icon_file"
            icon_check="$(mktemp -d "$RUNNER_TEMP/release-icon.XXXXXX")"
            iconutil -c iconset "$app_path/Contents/Resources/$icon_file" -o "$icon_check/AppIcon.iconset"
            test -s "$icon_check/AppIcon.iconset/icon_512x512@2x.png"
            rm -rf -- "$icon_check"
            codesign --verify --deep --strict --verbose=2 "$app_path"
            codesign --display --verbose=4 "$app_path" 2>&1 | grep -Fq "Authority=$DEVELOPER_ID_APPLICATION"
            codesign --display --verbose=4 "$app_path" 2>&1 | grep -q 'flags=.*runtime'
            spctl --assess --type execute --verbose=4 "$app_path"
            xcrun stapler validate "$app_path"
          }
          verify_native_app() {
            local app_path="$1"
            local expected_arch="$2"
            local helper="$app_path/Contents/MacOS/LumenPluginWorker"
            local parser_helper="$app_path/Contents/MacOS/LumenParserWorker"
            local parser_bundle="$app_path/Contents/Resources/CodeMirrorParserBundle.js"
            verify_app "$app_path" "$expected_arch"
            test "$(plutil -extract LSMultipleInstancesProhibited raw -o - "$app_path/Contents/Info.plist")" = true
            app_entitlements="$(codesign --display --entitlements :- "$app_path" 2>/dev/null)"
            app_sandbox="$(plutil -extract com.apple.security.app-sandbox raw -expect bool \
              -o - - <<<"$app_entitlements")"
            test "$app_sandbox" = true
            test "$(plutil -extract CFBundleVersion raw -o - "$app_path/Contents/Info.plist")" = "$GITHUB_RUN_NUMBER"
            test -x "$app_path/Contents/MacOS/LumenEditor"
            test -x "$helper"
            test -x "$parser_helper"
            test -s "$parser_bundle"
            cmp -s native-macos/Sources/LumenEditorApp/Resources/CodeMirrorParserBundle.js \
              "$parser_bundle"
            test -s "$app_path/Contents/Resources/en.lproj/InfoPlist.strings"
            test -s "$app_path/Contents/Resources/zh_CN.lproj/InfoPlist.strings"
            cmp -s native-macos/Packaging/en.lproj/InfoPlist.strings \
              "$app_path/Contents/Resources/en.lproj/InfoPlist.strings"
            cmp -s native-macos/Packaging/zh_CN.lproj/InfoPlist.strings \
              "$app_path/Contents/Resources/zh_CN.lproj/InfoPlist.strings"
            test "$(lipo -archs "$app_path/Contents/MacOS/LumenEditor")" = "$expected_arch"
            test "$(lipo -archs "$helper")" = "$expected_arch"
            test "$(lipo -archs "$parser_helper")" = "$expected_arch"
            codesign --verify --strict --verbose=2 "$helper"
            helper_signing="$(codesign --display --verbose=4 "$helper" 2>&1)"
            grep -Fq "Authority=$DEVELOPER_ID_APPLICATION" <<<"$helper_signing"
            grep -q 'flags=.*runtime' <<<"$helper_signing"
            helper_entitlements="$(codesign --display --entitlements :- "$helper" 2>/dev/null)"
            helper_sandbox="$(plutil -extract com.apple.security.app-sandbox raw -expect bool \
              -o - - <<<"$helper_entitlements")"
            helper_inherit="$(plutil -extract com.apple.security.inherit raw -expect bool \
              -o - - <<<"$helper_entitlements")"
            test "$helper_sandbox" = true
            test "$helper_inherit" = true
            codesign --verify --strict --verbose=2 "$parser_helper"
            parser_signing="$(codesign --display --verbose=4 "$parser_helper" 2>&1)"
            grep -Fq "Authority=$DEVELOPER_ID_APPLICATION" <<<"$parser_signing"
            grep -q 'flags=.*runtime' <<<"$parser_signing"
            parser_entitlements="$(codesign --display --entitlements :- \
              "$parser_helper" 2>/dev/null)"
            parser_sandbox="$(plutil -extract com.apple.security.app-sandbox raw -expect bool \
              -o - - <<<"$parser_entitlements")"
            parser_inherit="$(plutil -extract com.apple.security.inherit raw -expect bool \
              -o - - <<<"$parser_entitlements")"
            test "$parser_sandbox" = true
            test "$parser_inherit" = true
            python3 native-macos/scripts/run-packaged-parser-smoke.py \
              "$app_path/Contents/MacOS/LumenEditor"
          }
          only_top_level_app() {
            local root="$1"
            local candidates=()
            for candidate in "$root"/*.app; do
              if [ -d "$candidate" ] && [ ! -L "$candidate" ]; then candidates+=("$candidate"); fi
            done
            if [ "${#candidates[@]}" -ne 1 ]; then
              echo "Expected exactly one top-level application in $root, found ${#candidates[@]}." >&2
              return 1
            fi
            printf '%s\n' "${candidates[0]}"
          }

          if [ "$RELEASE_ARCH" = x64 ]; then
            APP_OUTPUT_DIR="$OUTPUT/mac"
            EXPECTED_ARCH=x86_64
          else
            APP_OUTPUT_DIR="$OUTPUT/mac-arm64"
            EXPECTED_ARCH=arm64
          fi
          APP_PATH="$(only_top_level_app "$APP_OUTPUT_DIR")"
          verify_app "$APP_PATH" "$EXPECTED_ARCH"

          ZIP_DIR="$(mktemp -d "$RUNNER_TEMP/text-editor-zip.XXXXXX")"
          ditto -x -k "$ZIP" "$ZIP_DIR"
          ZIP_APP="$(only_top_level_app "$ZIP_DIR")"
          verify_app "$ZIP_APP" "$EXPECTED_ARCH"

          MOUNT_PARENT="$(mktemp -d "$RUNNER_TEMP/text-editor-dmg.XXXXXX")"
          MOUNT_DIR="$MOUNT_PARENT/volume"
          mkdir "$MOUNT_DIR"
          hdiutil attach -nobrowse -readonly -mountpoint "$MOUNT_DIR" "$DMG"
          cleanup_dmg() { hdiutil detach "$MOUNT_DIR" >/dev/null 2>&1 || true; }
          trap cleanup_dmg EXIT
          DMG_APP="$(only_top_level_app "$MOUNT_DIR")"
          verify_app "$DMG_APP" "$EXPECTED_ARCH"
          spctl --assess --type open --context context:primary-signature --verbose=4 "$DMG"
          hdiutil detach "$MOUNT_DIR"
          trap - EXIT

          NATIVE_ZIP_DIR="$(mktemp -d "$RUNNER_TEMP/text-editor-native-zip.XXXXXX")"
          ditto -x -k "$NATIVE_ZIP" "$NATIVE_ZIP_DIR"
          NATIVE_ZIP_APP="$(only_top_level_app "$NATIVE_ZIP_DIR")"
          verify_native_app "$NATIVE_ZIP_APP" "$EXPECTED_ARCH"
          python3 native-macos/scripts/run-packaged-window-smoke.py \
            "$NATIVE_ZIP_APP" \
            "$EVIDENCE_DIR/native-zip-window-smoke.json"
          xattr -w com.apple.quarantine \
            "0081;$(printf '%x' "$(date +%s)");LumenReleaseCI;$(uuidgen)" \
            "$NATIVE_ZIP_APP"
          xattr -p com.apple.quarantine "$NATIVE_ZIP_APP" >/dev/null
          spctl --assess --type execute --verbose=4 "$NATIVE_ZIP_APP"
          python3 native-macos/scripts/run-packaged-parser-smoke.py \
            "$NATIVE_ZIP_APP/Contents/MacOS/LumenEditor"

          NATIVE_MOUNT_PARENT="$(mktemp -d "$RUNNER_TEMP/text-editor-native-dmg.XXXXXX")"
          NATIVE_MOUNT_DIR="$NATIVE_MOUNT_PARENT/volume"
          mkdir "$NATIVE_MOUNT_DIR"
          hdiutil attach -nobrowse -readonly -mountpoint "$NATIVE_MOUNT_DIR" "$NATIVE_DMG"
          cleanup_native_dmg() { hdiutil detach "$NATIVE_MOUNT_DIR" >/dev/null 2>&1 || true; }
          trap cleanup_native_dmg EXIT
          NATIVE_DMG_APP="$(only_top_level_app "$NATIVE_MOUNT_DIR")"
          verify_native_app "$NATIVE_DMG_APP" "$EXPECTED_ARCH"
          spctl --assess --type open --context context:primary-signature --verbose=4 "$NATIVE_DMG"
          python3 native-macos/scripts/run-packaged-window-smoke.py \
            "$NATIVE_DMG_APP" \
            "$EVIDENCE_DIR/native-dmg-window-smoke.json"
          QUARANTINE_COPY_ROOT="$(mktemp -d "$RUNNER_TEMP/text-editor-native-quarantine.XXXXXX")"
          ditto "$NATIVE_DMG_APP" "$QUARANTINE_COPY_ROOT/Lumen Editor Native.app"
          QUARANTINE_APP="$QUARANTINE_COPY_ROOT/Lumen Editor Native.app"
          xattr -w com.apple.quarantine \
            "0081;$(printf '%x' "$(date +%s)");LumenReleaseCI;$(uuidgen)" \
            "$QUARANTINE_APP"
          xattr -p com.apple.quarantine "$QUARANTINE_APP" >/dev/null
          spctl --assess --type execute --verbose=4 "$QUARANTINE_APP"
          python3 native-macos/scripts/run-packaged-parser-smoke.py \
            "$QUARANTINE_APP/Contents/MacOS/LumenEditor"
          hdiutil detach "$NATIVE_MOUNT_DIR"
          trap - EXIT

          node scripts/release-artifacts.mjs stage "macos-$RELEASE_ARCH"
      - name: Upload native macOS runtime evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: native-release-evidence-macos-${{ matrix.arch }}
          path: ${{ runner.temp }}/native-macos-release-evidence-${{ matrix.arch }}/*.json
          if-no-files-found: warn
          retention-days: 30
      - name: Remove temporary signing keychain
        if: ${{ always() }}
        run: |
          set +e
          original_keychains="$RUNNER_TEMP/lumen-release-${GITHUB_RUN_ID}-${{ matrix.arch }}-keychains.txt"
          security delete-keychain "$RUNNER_TEMP/lumen-release-${GITHUB_RUN_ID}-${{ matrix.arch }}.keychain-db" || true
          if [ -s "$original_keychains" ]; then
            original=()
            while IFS= read -r existing; do
              existing="${existing#\"}"
              existing="${existing%\"}"
              [ -n "$existing" ] && original+=("$existing")
            done < "$original_keychains"
            [ "${#original[@]}" -eq 0 ] || \
              security list-keychains -d user -s "${original[@]}"
          fi
          rm -f -- "$RUNNER_TEMP/lumen-release-${GITHUB_RUN_ID}-${{ matrix.arch }}.p12" "$original_keychains"
      - name: Upload macOS release files
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-macos-${{ matrix.arch }}
          path: release-assets/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  build-windows:
    name: Windows Electron x64 + native MSIX
    needs: validate
    runs-on: windows-2022
    environment: production-release
    steps:
      - name: Check out the tagged source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Require Windows signing credentials
        shell: pwsh
        env:
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:WIN_CSC_LINK) -or [string]::IsNullOrWhiteSpace($env:WIN_CSC_KEY_PASSWORD)) {
            throw 'Configure WIN_CSC_LINK and WIN_CSC_KEY_PASSWORD in the production-release environment.'
          }
      - run: npm ci
      - run: npm run build
      - name: Verify native Windows core and WinUI build
        shell: pwsh
        run: ./native-windows/scripts/verify.ps1
      - name: Package signed installer and portable executable
        shell: pwsh
        env:
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
        run: npx --no-install electron-builder --win --x64 --publish never --config.forceCodeSigning=true
      - name: Package signed native Windows MSIX files
        shell: pwsh
        env:
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
        run: |
          $version = node -p "require('./package.json').version"
          foreach ($architecture in @('x64', 'arm64')) {
            ./native-windows/scripts/package-msix.ps1 `
              -Architecture $architecture `
              -OutputDirectory "release/$version" `
              -CertificateSource $env:WIN_CSC_LINK `
              -CertificatePassword $env:WIN_CSC_KEY_PASSWORD
          }
      - name: Install and exercise the signed native Windows x64 MSIX
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          $package = "release/$version/text-editor-xujieyang-$version-native-windows-x64.msix"
          $evidence = Join-Path $env:RUNNER_TEMP 'native-windows-release-evidence/window-smoke-x64.json'
          ./native-windows/scripts/smoke-installed-msix.ps1 `
            -PackagePath $package `
            -EvidencePath $evidence
      - name: Verify Authenticode signatures and stage files
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          $expected = @(
            "release/$version/text-editor-xujieyang-$version-windows-x64-setup.exe",
            "release/$version/text-editor-xujieyang-$version-windows-x64-portable.exe",
            "release/$version/text-editor-xujieyang-$version-native-windows-x64.msix",
            "release/$version/text-editor-xujieyang-$version-native-windows-arm64.msix"
          )
          $signtoolCommand = Get-Command signtool.exe -ErrorAction SilentlyContinue
          $signtoolPath = if ($signtoolCommand) { $signtoolCommand.Source } else { $null }
          if (-not $signtoolPath) {
            $signtoolPath = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Recurse -Filter signtool.exe |
              Where-Object { $_.Directory.Name -eq 'x64' } |
              Sort-Object FullName -Descending |
              Select-Object -First 1 -ExpandProperty FullName
          }
          if (-not $signtoolPath) { throw 'signtool.exe was not found on the runner.' }
          foreach ($file in $expected) {
            if (-not (Test-Path -LiteralPath $file -PathType Leaf)) { throw "Missing Windows release file: $file" }
            & $signtoolPath verify /pa /all /v $file
            if ($LASTEXITCODE -ne 0) { throw "Authenticode verification failed: $file" }
          }
          node scripts/release-artifacts.mjs stage windows-x64
      - name: Upload native Windows runtime evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: native-release-evidence-windows-x64
          path: ${{ runner.temp }}/native-windows-release-evidence/*.json
          if-no-files-found: warn
          retention-days: 30
      - name: Upload Windows release files
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-windows-x64
          path: release-assets/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  publish:
    name: Publish GitHub Release
    needs:
      - build-linux
      - build-windows
      - build-macos
    runs-on: ubuntu-22.04
    environment: production-release
    permissions:
      contents: write
    steps:
      - name: Check out the tagged source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Download all platform artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: release-*
          path: artifacts
          merge-multiple: true
      - name: Prepare an immutable release slot
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          STATUS="$(curl --silent --show-error --output "$RUNNER_TEMP/existing-release.json" --write-out '%{http_code}' \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/releases/tags/$GITHUB_REF_NAME")"
          case "$STATUS" in
            404) ;;
            200)
              if [ "$(node -p "JSON.parse(require('fs').readFileSync(process.argv[1], 'utf8')).draft" "$RUNNER_TEMP/existing-release.json")" != true ]; then
                echo "Published release $GITHUB_REF_NAME already exists; publish a new version instead of replacing assets." >&2
                exit 1
              fi
              RELEASE_ID="$(node -p "JSON.parse(require('fs').readFileSync(process.argv[1], 'utf8')).id" "$RUNNER_TEMP/existing-release.json")"
              curl --fail-with-body --silent --show-error --request DELETE \
                --header "Authorization: Bearer $GH_TOKEN" \
                --header 'Accept: application/vnd.github+json' \
                --header 'X-GitHub-Api-Version: 2022-11-28' \
                "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID"
              ;;
            *) echo "Could not verify release immutability (GitHub API HTTP $STATUS)." >&2; exit 1 ;;
          esac
      - name: Verify the complete release and generate checksums
        run: node scripts/release-artifacts.mjs verify-all "${GITHUB_REF_NAME}" artifacts
      - name: Create a draft release and upload the verified files
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          draft: true
          overwrite_files: false
          fail_on_unmatched_files: true
          generate_release_notes: true
          make_latest: false
          body: |
            ## 下载说明

            - Windows x64：选择名称以 `windows-x64-setup.exe` 结尾的安装版；免安装使用 `windows-x64-portable.exe`。
            - 原生 Windows 版：选择 `native-windows-x64.msix`（Intel/AMD）或 `native-windows-arm64.msix`（ARM64）；两个包均经过签名和包内清单验证。
            - 原生 macOS 版：选择名称含 `native-macos-arm64`（Apple Silicon）或 `native-macos-x64`（Intel）的 DMG；ZIP 适合免安装解压使用。
            - Electron macOS 版：选择名称以 `macos-arm64.dmg` 或 `macos-x64.dmg` 结尾、且不含 `native` 的文件。
            - Linux x64：通用桌面优先选择名称以 `linux-x86_64.AppImage` 结尾的文件；Debian/Ubuntu 可选择 `linux-amd64.deb`。
            - `SHA256SUMS.txt` 可用于核对下载文件完整性。macOS 文件已进行 Developer ID 签名和 Apple 公证，Windows 文件已进行 Authenticode 签名。
          files: |
            artifacts/*.exe
            artifacts/*.msix
            artifacts/*.dmg
            artifacts/*.zip
            artifacts/*.AppImage
            artifacts/*.deb
            artifacts/SHA256SUMS.txt
            artifacts/release-manifest.json
      - name: Publish the completed draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RELEASE_ID="$(curl --fail-with-body --silent --show-error \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/releases/tags/$GITHUB_REF_NAME" | \
            node -e "let data=''; process.stdin.on('data', chunk => data += chunk).on('end', () => process.stdout.write(String(JSON.parse(data).id)))")"
          curl --fail-with-body --silent --show-error --request PATCH \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" \
            --data '{"draft":false,"make_latest":"true"}' >/dev/null
