name: Native iOS CI

on:
  push:
    branches: [main]
    paths:
      - "native-ios/**"
      - "scripts/check-native-ios.mjs"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/native-ios.yml"
  pull_request:
    paths:
      - "native-ios/**"
      - "scripts/check-native-ios.mjs"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/native-ios.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-ios-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    name: Mobile architecture contract
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out the source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@1e60f620b9541dca1515402f5c3e3040d8c59e00 # v4.0.4
        with:
          node-version: 20
          cache: npm
      - name: Install locked JavaScript dependencies
        run: npm ci
      - name: Verify native iOS contract
        run: npm run check:native-ios

  build-and-test:
    name: Xcode build and simulator tests
    runs-on: macos-15
    timeout-minutes: 55
    steps:
      - name: Check out the source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Verify toolchain and capture environment metadata
        run: |
          set -euo pipefail
          {
            xcodebuild -version
            sw_vers
            printf 'commit: %s\n' "$(git rev-parse HEAD)"
            printf 'workflow run: %s/%s/actions/runs/%s\n' \
              "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID"
            printf 'developer directory: %s\n' "$(xcode-select -p)"
            printf 'iPhoneOS SDK: %s\n' "$(xcrun --sdk iphoneos --show-sdk-version)"
            printf 'iPhoneSimulator SDK: %s\n' \
              "$(xcrun --sdk iphonesimulator --show-sdk-version)"
            xcrun simctl list devices available
          } > "$RUNNER_TEMP/LumenEditorIOS-environment.txt"
          xcodebuild -project native-ios/LumenEditorIOS.xcodeproj -list
          plutil -lint native-ios/Info.plist
          plutil -lint native-ios/Resources/PrivacyInfo.xcprivacy
          plutil -lint native-ios/Resources/en.lproj/Localizable.strings
          plutil -lint native-ios/Resources/zh-Hans.lproj/Localizable.strings
          plutil -lint native-ios/Resources/en.lproj/InfoPlist.strings
          plutil -lint native-ios/Resources/zh-Hans.lproj/InfoPlist.strings
      - name: Build iPhone and iPad compatible app without signing
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          xcodebuild build \
            -project native-ios/LumenEditorIOS.xcodeproj \
            -scheme LumenEditorIOS \
            -configuration Release \
            -destination 'generic/platform=iOS Simulator' \
            -resultBundlePath "$RUNNER_TEMP/LumenEditorIOS-ReleaseBuild.xcresult" \
            CODE_SIGNING_ALLOWED=NO \
            SWIFT_TREAT_WARNINGS_AS_ERRORS=YES \
            SWIFT_STRICT_CONCURRENCY=complete
      - name: Run Xcode static analysis
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          xcodebuild analyze \
            -project native-ios/LumenEditorIOS.xcodeproj \
            -scheme LumenEditorIOS \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -resultBundlePath "$RUNNER_TEMP/LumenEditorIOS-Analyze.xcresult" \
            CODE_SIGNING_ALLOWED=NO \
            SWIFT_TREAT_WARNINGS_AS_ERRORS=YES \
            SWIFT_STRICT_CONCURRENCY=complete
      - name: Select iPhone and iPad simulators
        if: ${{ !cancelled() }}
        id: simulator
        run: |
          set -euo pipefail
          simulator_selection="$(python3 - <<'PY'
          import json, re, subprocess
          devices = json.loads(subprocess.check_output(
              ["xcrun", "simctl", "list", "devices", "available", "-j"], text=True
          ))["devices"]

          def ios_version(runtime):
              match = re.search(r"\.iOS-(\d+(?:-\d+)*)$", runtime)
              return tuple(map(int, match.group(1).split("-"))) if match else None

          runtimes = []
          for runtime in devices:
              version = ios_version(runtime)
              if version is not None:
                  runtimes.append((version, runtime))
          runtimes.sort(reverse=True)
          for version, runtime in runtimes:
              iphone = None
              ipad = None
              for device in devices[runtime]:
                  if iphone is None and device["name"].startswith("iPhone"):
                      iphone = device
                  if ipad is None and device["name"].startswith("iPad"):
                      ipad = device
              if iphone is not None and ipad is not None:
                  print("\t".join((
                      iphone["udid"], iphone["name"],
                      ipad["udid"], ipad["name"],
                      ".".join(map(str, version))
                  )))
                  raise SystemExit
          raise SystemExit("No matching iPhone and iPad simulators")
          PY
          )"
          IFS=$'\t' read -r iphone_id iphone_name ipad_id ipad_name ios_version \
            <<< "$simulator_selection"
          echo "iphone_id=$iphone_id" >> "$GITHUB_OUTPUT"
          echo "ipad_id=$ipad_id" >> "$GITHUB_OUTPUT"
          {
            printf 'iOS runtime: %s\n' "$ios_version"
            printf 'iPhone simulator: %s (%s)\n' "$iphone_name" "$iphone_id"
            printf 'iPad simulator: %s (%s)\n' "$ipad_name" "$ipad_id"
          } >> "$RUNNER_TEMP/LumenEditorIOS-environment.txt"
      - name: Build the shared simulator test products
        if: ${{ !cancelled() && steps.simulator.outputs.iphone_id != '' }}
        run: |
          set -euo pipefail
          xcodebuild build-for-testing \
            -project native-ios/LumenEditorIOS.xcodeproj \
            -scheme LumenEditorIOS \
            -configuration Debug \
            -destination "id=${{ steps.simulator.outputs.iphone_id }}" \
            -derivedDataPath "$RUNNER_TEMP/LumenEditorIOS-DerivedData" \
            -resultBundlePath "$RUNNER_TEMP/LumenEditorIOS-TestBuild.xcresult" \
            SWIFT_TREAT_WARNINGS_AS_ERRORS=YES \
            SWIFT_STRICT_CONCURRENCY=complete
      - name: Run mobile Core and isolated iPhone UI flows
        if: ${{ !cancelled() && steps.simulator.outputs.iphone_id != '' }}
        run: |
          set -euo pipefail
          iphone_id="${{ steps.simulator.outputs.iphone_id }}"
          cleanup() { xcrun simctl shutdown "$iphone_id" >/dev/null 2>&1 || true; }
          trap cleanup EXIT
          cleanup
          xcrun simctl erase "$iphone_id"
          xcrun simctl boot "$iphone_id" || true
          xcrun simctl bootstatus "$iphone_id" -b
          result_bundle="$RUNNER_TEMP/LumenEditorIOS-iPhone.xcresult"
          xcodebuild test-without-building \
            -project native-ios/LumenEditorIOS.xcodeproj \
            -scheme LumenEditorIOS \
            -destination "id=$iphone_id" \
            -derivedDataPath "$RUNNER_TEMP/LumenEditorIOS-DerivedData" \
            -resultBundlePath "$result_bundle" \
            -test-timeouts-enabled YES \
            -default-test-execution-time-allowance 90 \
            -maximum-test-execution-time-allowance 180 \
            SWIFT_TREAT_WARNINGS_AS_ERRORS=YES \
            SWIFT_STRICT_CONCURRENCY=complete
      - name: Run isolated iPad UI flows
        if: ${{ !cancelled() && steps.simulator.outputs.ipad_id != '' }}
        run: |
          set -euo pipefail
          ipad_id="${{ steps.simulator.outputs.ipad_id }}"
          cleanup() { xcrun simctl shutdown "$ipad_id" >/dev/null 2>&1 || true; }
          trap cleanup EXIT
          cleanup
          xcrun simctl erase "$ipad_id"
          xcrun simctl boot "$ipad_id" || true
          xcrun simctl bootstatus "$ipad_id" -b
          result_bundle="$RUNNER_TEMP/LumenEditorIOS-iPad.xcresult"
          xcodebuild test-without-building \
            -project native-ios/LumenEditorIOS.xcodeproj \
            -scheme LumenEditorIOS \
            -destination "id=$ipad_id" \
            -derivedDataPath "$RUNNER_TEMP/LumenEditorIOS-DerivedData" \
            -only-testing:LumenEditorIOSUITests \
            -resultBundlePath "$result_bundle" \
            -test-timeouts-enabled YES \
            -default-test-execution-time-allowance 90 \
            -maximum-test-execution-time-allowance 180
      - name: Verify Release archive metadata without signing
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          archive_path="$RUNNER_TEMP/LumenEditorIOS.xcarchive"
          xcodebuild archive \
            -project native-ios/LumenEditorIOS.xcodeproj \
            -scheme LumenEditorIOS \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$archive_path" \
            -resultBundlePath "$RUNNER_TEMP/LumenEditorIOS-Archive.xcresult" \
            CODE_SIGNING_ALLOWED=NO \
            SWIFT_TREAT_WARNINGS_AS_ERRORS=YES \
            SWIFT_STRICT_CONCURRENCY=complete
          app_path="$archive_path/Products/Applications/Lumen Editor.app"
          test -f "$app_path/PrivacyInfo.xcprivacy"
          test -f "$app_path/Assets.car"
          test -f "$app_path/en.lproj/InfoPlist.strings"
          test -f "$app_path/zh-Hans.lproj/InfoPlist.strings"
          executable="$app_path/Lumen Editor"
          test -x "$executable"
          if grep -aFq 'LUMEN_UI_TEST_SESSION' "$executable"; then
            echo 'Release executable exposes the DEBUG-only UI-test environment key' >&2
            exit 1
          fi
          plutil -extract CFBundleIdentifier raw "$app_path/Info.plist" \
            | grep -Fx 'com.lumen.editor.native-preview.ios'
          plutil -extract MinimumOSVersion raw "$app_path/Info.plist" \
            | grep -Fx '17.0'
          test "$(plutil -extract CFBundleShortVersionString raw "$app_path/Info.plist")" != ""
          test "$(plutil -extract CFBundleVersion raw "$app_path/Info.plist")" != ""
          plutil -extract UIDeviceFamily.0 raw "$app_path/Info.plist" | grep -Fx '1'
          plutil -extract UIDeviceFamily.1 raw "$app_path/Info.plist" | grep -Fx '2'
      - name: Verify Xcode result bundles are readable
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          status=0
          for phase in ReleaseBuild Analyze TestBuild Archive; do
            if ! test -d "$RUNNER_TEMP/LumenEditorIOS-$phase.xcresult"; then
              printf '%s result bundle is missing\n' "$phase" >&2
              status=1
            fi
          done
          for device in iPhone iPad; do
            result_bundle="$RUNNER_TEMP/LumenEditorIOS-$device.xcresult"
            summary="$RUNNER_TEMP/LumenEditorIOS-$device-summary.json"
            if ! test -d "$result_bundle"; then
              printf '%s result bundle is missing\n' "$device" >&2
              status=1
              continue
            fi
            if ! xcrun xcresulttool get test-results summary \
              --path "$result_bundle" > "$summary"; then
              printf '%s result bundle is unreadable\n' "$device" >&2
              status=1
              continue
            fi
            if ! python3 -m json.tool "$summary" >/dev/null; then
              printf '%s result summary is not valid JSON\n' "$device" >&2
              status=1
              continue
            fi
            if ! python3 - "$device" "$summary" <<'PY'
          import json, re, sys
          from pathlib import Path

          device, summary_path = sys.argv[1:]
          test_root = Path("native-ios/Tests")

          def test_count(directory):
              return sum(
                  len(re.findall(r"^\s*func test\w*\s*\(", path.read_text(), re.MULTILINE))
                  for path in directory.glob("*.swift")
              )

          ui_tests = test_count(test_root / "LumenEditorIOSUITests")
          core_tests = test_count(test_root / "LumenEditorMobileCoreTests")
          expected = ui_tests + (core_tests if device == "iPhone" else 0)
          summary = json.loads(Path(summary_path).read_text())
          actual = summary.get("totalTestCount")
          if actual != expected:
              raise SystemExit(
                  f"{device} executed {actual!r} tests; expected {expected} "
                  f"({core_tests} Core + {ui_tests} UI in source)"
              )
          print(f"{device} result includes all {expected} expected tests")
          PY
            then
              status=1
            fi
          done
          exit "$status"
      - name: Upload Xcode test evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: native-ios-xcresult
          path: |
            ${{ runner.temp }}/LumenEditorIOS-*.xcresult
            ${{ runner.temp }}/LumenEditorIOS-*-summary.json
            ${{ runner.temp }}/LumenEditorIOS-environment.txt
          if-no-files-found: warn
          retention-days: 14
      - name: Upload unsigned archive evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: native-ios-unsigned-xcarchive
          path: ${{ runner.temp }}/LumenEditorIOS.xcarchive
          if-no-files-found: warn
          retention-days: 7
