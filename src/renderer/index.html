<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'; worker-src blob:; connect-src 'none'; img-src 'self' data: https: http:"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lumen 编辑器</title>
  </head>
  <body>
    <div id="app">
      <div id="sidebar" class="hidden">
        <div class="sidebar-header">
          <span id="workspace-name">未打开文件夹</span>
        </div>
        <div id="file-tree" class="file-tree"></div>
        <div id="git-panel-host" class="git-panel-host"></div>
      </div>
      <div id="main">
        <div id="layout-root" class="layout-root layout-single">
          <section id="editor-group-0" class="editor-group">
            <div id="tab-bar" class="tab-bar"></div>
            <div id="editor-area" class="editor-area">
              <div id="editor-host" class="editor-host">
            <button
              id="preview-btn"
              class="editor-fab hidden"
              hidden
              title="Markdown 预览（Ctrl/Cmd+Shift+V）"
              aria-label="Markdown 预览"
              data-tooltip="Markdown 预览"
            >
              <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
                <path
                  d="M4 5h16v14H4z"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="1.6"
                />
                <path
                  d="M7 9v6M7 9l2.2 2.6L11.4 9v6M14.5 9v4.5M14.5 13.5L13 12M14.5 13.5L16 12"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="1.4"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                />
              </svg>
            </button>
            <button
              id="browser-btn"
              class="editor-fab hidden"
              hidden
              title="使用浏览器打开当前 HTML"
              aria-label="使用浏览器打开当前 HTML"
              data-tooltip="使用浏览器打开"
            >
              <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
                <circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="1.6" />
                <ellipse
                  cx="12"
                  cy="12"
                  rx="4"
                  ry="9"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="1.6"
                />
                <path d="M3 12h18M4 7.5h16M4 16.5h16" stroke="currentColor" stroke-width="1.4" />
              </svg>
            </button>
              </div>
              <div id="find-results-host" class="find-results-host"></div>
            </div>
          </section>
        </div>
        <div id="status-bar" class="status-bar">
          <span id="status-position" class="status-item">行 1，列 1</span>
          <span class="status-spacer"></span>
          <span id="status-selection" class="status-item"></span>
          <span id="status-eol" class="status-item">LF</span>
          <span id="status-encoding" class="status-item">UTF-8</span>
          <span id="status-language" class="status-item">纯文本</span>
        </div>
      </div>
    </div>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
