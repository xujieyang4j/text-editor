<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'; img-src 'self' data: https: http:"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lumen Editor</title>
  </head>
  <body>
    <div id="app">
      <div id="sidebar">
        <div class="sidebar-header">
          <span id="workspace-name">No Folder Opened</span>
        </div>
        <div id="file-tree" class="file-tree"></div>
      </div>
      <div id="main">
        <div id="tab-bar" class="tab-bar"></div>
        <div id="editor-area" class="editor-area">
          <div id="editor-host" class="editor-host"></div>
          <button
            id="browser-btn"
            class="browser-btn hidden"
            title="Open in browser"
            aria-label="Open in browser"
          >
            <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
              <circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="1.6" />
              <ellipse
                cx="12"
                cy="12"
                rx="4"
                ry="9"
                fill="none"
                stroke="currentColor"
                stroke-width="1.6"
              />
              <path d="M3 12h18M4 7.5h16M4 16.5h16" stroke="currentColor" stroke-width="1.4" />
            </svg>
          </button>
        </div>
        <div id="status-bar" class="status-bar">
          <span id="status-position" class="status-item">Ln 1, Col 1</span>
          <span class="status-spacer"></span>
          <span id="status-selection" class="status-item"></span>
          <span id="status-eol" class="status-item">LF</span>
          <span id="status-encoding" class="status-item">UTF-8</span>
          <span id="status-language" class="status-item">Plain Text</span>
        </div>
      </div>
    </div>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
