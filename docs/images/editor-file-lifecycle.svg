<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="580" viewBox="0 0 1400 580" role="img" aria-labelledby="title">
<title id="title">从打开到恢复的文件使用流程</title><style>text{font-family:-apple-system,BlinkMacSystemFont,"Microsoft YaHei",sans-serif}.h{font-size:26px;font-weight:700;fill:#17233a}.t{font-size:18px;fill:#42536d}.box{font-size:20px;font-weight:700;fill:#183252}.s{font-size:16px;fill:#5c6d84}.key{font-family:ui-monospace,Consolas,monospace;font-size:15px;fill:#245b9d;font-weight:700}</style><rect width="1400" height="580" rx="20" fill="#eff4fa"/><text x="70" y="68" class="h">一次可靠的编辑流程</text>
<g fill="white" stroke="#c7d5e8" stroke-width="2"><rect x="70" y="150" width="210" height="240" rx="16"/><rect x="350" y="150" width="210" height="240" rx="16"/><rect x="630" y="150" width="210" height="240" rx="16"/><rect x="910" y="150" width="210" height="240" rx="16"/><rect x="1190" y="150" width="150" height="240" rx="16"/></g>
<g fill="#2e70bc"><circle cx="105" cy="131" r="21"/><circle cx="385" cy="131" r="21"/><circle cx="665" cy="131" r="21"/><circle cx="945" cy="131" r="21"/><circle cx="1225" cy="131" r="21"/></g><g fill="white" font-family="sans-serif" font-weight="bold" font-size="20"><text x="99" y="138">1</text><text x="379" y="138">2</text><text x="659" y="138">3</text><text x="939" y="138">4</text><text x="1219" y="138">5</text></g>
<text x="95" y="202" class="box">打开</text><text x="95" y="242" class="t">单个文件、文件夹</text><text x="95" y="270" class="t">或直接拖放。</text><text x="95" y="322" class="key">Ctrl/Cmd+O</text><text x="95" y="347" class="key">Ctrl/Cmd+Shift+O</text>
<text x="375" y="202" class="box">编辑</text><text x="375" y="242" class="t">标签页前的 ●</text><text x="375" y="270" class="t">表示未保存改动。</text><text x="375" y="322" class="s">多光标、折叠、</text><text x="375" y="347" class="s">自动补全均可用。</text>
<text x="655" y="202" class="box">保存</text><text x="655" y="242" class="t">未命名文档会要求</text><text x="655" y="270" class="t">选择存储位置。</text><text x="655" y="322" class="key">Ctrl/Cmd+S</text><text x="655" y="347" class="key">另存为：Shift+S</text>
<text x="935" y="202" class="box">冲突处理</text><text x="935" y="242" class="t">外部更改与本地</text><text x="935" y="270" class="t">未保存内容冲突时，</text><text x="935" y="310" class="s">比较 / 重载 / 保留</text><text x="935" y="336" class="s">/ 另存为，绝不静默覆盖。</text>
<text x="1210" y="202" class="box">恢复</text><text x="1210" y="242" class="t">关闭或意外退出后</text><text x="1210" y="270" class="t">自动恢复会话与草稿。</text><text x="1210" y="322" class="s">重开标签：</text><text x="1210" y="347" class="key">Ctrl/Cmd+Shift+T</text>
<g stroke="#6993c5" stroke-width="4" fill="none"><path d="M282 270h48"/><path d="M562 270h48"/><path d="M842 270h48"/><path d="M1122 270h48"/></g><g fill="#6993c5"><path d="M318 257l23 13-23 13z"/><path d="M598 257l23 13-23 13z"/><path d="M878 257l23 13-23 13z"/><path d="M1158 257l23 13-23 13z"/></g><text x="70" y="480" class="t">提示：关闭含改动的标签时会先确认；文件树支持新建、重命名、复制、移动到回收站以及在系统文件管理器中显示。</text>
</svg>
