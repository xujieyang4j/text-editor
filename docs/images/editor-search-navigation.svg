<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="680" viewBox="0 0 1400 680" role="img" aria-labelledby="title">
<title id="title">命令面板、快速跳转和工作区搜索示意</title><style>text{font-family:-apple-system,BlinkMacSystemFont,"Microsoft YaHei",sans-serif}.h{font-size:25px;font-weight:700;fill:#17233a}.t{font-size:18px;fill:#42536d}.code{font-family:ui-monospace,Consolas,monospace;font-size:17px;fill:#dce8fa}.key{font-family:ui-monospace,Consolas,monospace;font-size:16px;fill:#245b9d;font-weight:700}</style><rect width="1400" height="680" rx="20" fill="#eef3fa"/>
<rect x="55" y="66" width="390" height="526" rx="16" fill="white" stroke="#c7d5e8" stroke-width="2"/><circle cx="94" cy="107" r="20" fill="#2e70bc"/><text x="88" y="114" fill="white" font-family="sans-serif" font-size="20" font-weight="bold">1</text><text x="126" y="114" class="h">命令面板</text><rect x="85" y="150" width="330" height="55" rx="8" fill="#25344a"/><text x="104" y="185" class="code">›  format document</text><rect x="85" y="214" width="330" height="46" rx="5" fill="#d9e9ff"/><text x="103" y="244" class="t">Tools: Format Document</text><text x="103" y="297" class="t">输入关键词模糊搜索全部命令，</text><text x="103" y="328" class="t">↑/↓ 选择，Enter 执行。</text><rect x="103" y="378" width="205" height="39" rx="7" fill="#edf5ff"/><text x="119" y="404" class="key">Ctrl/Cmd + Shift + P</text><text x="103" y="467" class="t">适合：不记得菜单位置、</text><text x="103" y="498" class="t">快速调用格式化、布局、设置等。</text>
<rect x="505" y="66" width="390" height="526" rx="16" fill="white" stroke="#c7d5e8" stroke-width="2"/><circle cx="544" cy="107" r="20" fill="#2e70bc"/><text x="538" y="114" fill="white" font-family="sans-serif" font-size="20" font-weight="bold">2</text><text x="576" y="114" class="h">快速跳转</text><rect x="535" y="150" width="330" height="55" rx="8" fill="#25344a"/><text x="554" y="185" class="code">›  main.ts:120</text><text x="553" y="247" class="t">文件名：搜索工作区文件</text><text x="553" y="286" class="t">:120：当前文件跳至第 120 行</text><text x="553" y="325" class="t">@render：当前文件按符号跳转</text><text x="553" y="364" class="t">#parse：项目范围搜索符号</text><rect x="553" y="413" width="151" height="39" rx="7" fill="#edf5ff"/><text x="570" y="439" class="key">Ctrl/Cmd + P</text><text x="553" y="501" class="t">可直接输入“文件名:行号”，</text><text x="553" y="532" class="t">打开文件并定位。</text>
<rect x="955" y="66" width="390" height="526" rx="16" fill="white" stroke="#c7d5e8" stroke-width="2"/><circle cx="994" cy="107" r="20" fill="#2e70bc"/><text x="988" y="114" fill="white" font-family="sans-serif" font-size="20" font-weight="bold">3</text><text x="1026" y="114" class="h">在文件中查找</text><rect x="985" y="150" width="330" height="55" rx="8" fill="#25344a"/><text x="1004" y="185" class="code">query:  TODO</text><rect x="985" y="218" width="156" height="35" rx="5" fill="#e5edf9"/><text x="999" y="242" class="t">☑ 区分大小写</text><rect x="1150" y="218" width="130" height="35" rx="5" fill="#e5edf9"/><text x="1165" y="242" class="t">☐ 正则</text><text x="1003" y="301" class="t">支持包含/排除 glob，例如：</text><text x="1003" y="337" class="key">包含：**/*.ts</text><text x="1003" y="371" class="key">排除：**/node_modules/**</text><text x="1003" y="426" class="t">结果独立保留；点击打开，</text><text x="1003" y="457" class="t">F4 / Shift+F4 上下切换。</text><rect x="1003" y="500" width="218" height="39" rx="7" fill="#edf5ff"/><text x="1021" y="526" class="key">Ctrl/Cmd + Shift + F</text>
</svg>
