<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="650" viewBox="0 0 1400 650" role="img" aria-labelledby="title">
<title id="title">项目工具和安全确认流程示意</title><style>text{font-family:-apple-system,BlinkMacSystemFont,"Microsoft YaHei",sans-serif}.h{font-size:26px;font-weight:700;fill:#17233a}.t{font-size:18px;fill:#42536d}.s{font-size:16px;fill:#617089}.box{font-size:20px;font-weight:700;fill:#183252}.key{font-family:ui-monospace,Consolas,monospace;font-size:16px;fill:#245b9d;font-weight:700}</style><rect width="1400" height="650" rx="20" fill="#eff4fa"/><text x="70" y="70" class="h">工具与外部命令：先配置，再执行；首次运行需确认</text>
<rect x="70" y="120" width="255" height="320" rx="16" fill="white" stroke="#c7d5e8" stroke-width="2"/><text x="96" y="165" class="box">1. 配置项目</text><text x="96" y="208" class="t">项目 → 配置项目…</text><text x="96" y="242" class="t">保存至：</text><rect x="95" y="260" width="202" height="39" rx="6" fill="#edf5ff"/><text x="110" y="285" class="key">.lumen-project.json</text><text x="96" y="337" class="s">可定义构建、格式化器、</text><text x="96" y="363" class="s">语言服务器与插件。</text>
<path d="M340 280h109" stroke="#6993c5" stroke-width="4"/><path d="M435 267l25 13-25 13" fill="#6993c5"/>
<rect x="475" y="120" width="255" height="320" rx="16" fill="white" stroke="#c7d5e8" stroke-width="2"/><text x="501" y="165" class="box">2. 发起操作</text><text x="501" y="208" class="t">工具 → 构建 / 格式化</text><text x="501" y="242" class="t">工具 → 项目终端</text><text x="501" y="288" class="s">也可使用 Git 面板：</text><text x="501" y="316" class="s">暂存、提交、分支、Diff。</text><text x="501" y="369" class="s">构建输出含文件/行列时</text><text x="501" y="395" class="s">可点击跳转到问题位置。</text>
<path d="M745 280h109" stroke="#6993c5" stroke-width="4"/><path d="M840 267l25 13-25 13" fill="#6993c5"/>
<rect x="880" y="120" width="390" height="320" rx="16" fill="#fffdf5" stroke="#e1bd55" stroke-width="2"/><path d="M914 145l25 44h-50z" fill="#e0aa2d"/><text x="927" y="180" fill="white" font-family="sans-serif" font-weight="bold">!</text><text x="961" y="165" class="box">3. 明确确认</text><text x="914" y="218" class="t">将从项目配置启动本地进程。</text><text x="914" y="254" class="t">工作目录：/your/project</text><rect x="914" y="292" width="148" height="47" rx="7" fill="#2e70bc"/><text x="944" y="323" fill="white" font-family="sans-serif" font-size="19" font-weight="700">确认执行</text><rect x="1074" y="292" width="114" height="47" rx="7" fill="#e6eaf0"/><text x="1105" y="323" class="box">取消</text><text x="914" y="383" class="s">每个应用会话首次运行需确认。</text>
<rect x="70" y="493" width="1200" height="89" rx="14" fill="#dbeafd"/><text x="98" y="531" class="box">安全提示</text><text x="98" y="560" class="t">仅在信任项目时运行构建命令、语言工具或终端命令。Git 的暂存、丢弃、提交、创建/切换分支同样会要求确认；“丢弃”会改写工作区文件。</text>
</svg>
