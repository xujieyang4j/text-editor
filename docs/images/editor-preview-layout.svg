<title id="title">Markdown 预览和多组布局示意</title><style>text{font-family:-apple-system,BlinkMacSystemFont,"Microsoft YaHei",sans-serif}.h{font-size:25px;font-weight:700;fill:#17233a}.t{font-size:18px;fill:#42536d}.code{font-family:ui-monospace,Consolas,monospace;font-size:16px;fill:#dce8fa}.cap{font-size:17px;fill:#273c5a;font-weight:700}</style><rect width="1400" height="690" rx="20" fill="#edf3fa"/>
<text x="78" y="70" class="h">Markdown：编辑与预览并排</text><text x="820" y="70" class="h">多组布局：并排比较与编辑</text>
<rect x="70" y="100" width="590" height="482" rx="12" fill="#222b3a"/><rect x="70" y="100" width="590" height="39" rx="12" fill="#344258"/><text x="94" y="126" class="code">README.md  ●</text><rect x="85" y="153" width="273" height="410" rx="5" fill="#1c2330"/><text x="107" y="195" class="code"><tspan fill="#c792ea"># Lumen Editor</tspan></text><text x="107" y="230" class="code">一款跨平台文本编辑器</text><text x="107" y="282" class="code"><tspan fill="#c792ea">## 快速开始</tspan></text><text x="107" y="318" class="code">- 打开文件夹</text><text x="107" y="351" class="code">- 输入并保存</text><text x="107" y="384" class="code">- 实时预览</text><rect x="373" y="153" width="272" height="410" rx="5" fill="#f8fafc"/><text x="395" y="201" font-family="sans-serif" font-size="27" font-weight="700" fill="#152238">Lumen Editor</text><line x1="395" y1="215" x2="615" y2="215" stroke="#d7dee8"/><text x="395" y="250" class="t">一款跨平台文本编辑器</text><text x="395" y="307" class="cap">快速开始</text><text x="400" y="343" class="t">• 打开文件夹</text><text x="400" y="374" class="t">• 输入并保存</text><text x="400" y="405" class="t">• 实时预览</text><rect x="212" y="599" width="305" height="42" rx="8" fill="#d8e9ff"/><text x="232" y="627" class="cap">Ctrl/Cmd + Shift + V</text>
<rect x="760" y="100" width="570" height="482" rx="12" fill="#222b3a"/><rect x="760" y="100" width="570" height="39" rx="12" fill="#344258"/><rect x="775" y="153" width="262" height="410" rx="5" fill="#1c2330"/><rect x="1052" y="153" width="262" height="410" rx="5" fill="#1c2330"/><rect x="775" y="153" width="262" height="35" fill="#35445c"/><rect x="1052" y="153" width="262" height="35" fill="#35445c"/><text x="794" y="177" class="code">before.ts</text><text x="1072" y="177" class="code">after.ts</text><text x="796" y="230" class="code">function format() {</text><text x="813" y="260" class="code">return  value</text><text x="796" y="290" class="code">}</text><text x="1073" y="230" class="code">function format() {</text><rect x="1068" y="240" width="172" height="32" fill="#315741"/><text x="1090" y="262" class="code">return value</text><text x="1073" y="290" class="code">}</text><text x="795" y="370" class="t" fill="#aac0dc">每一组均有独立标签栏和活动文件</text><rect x="904" y="599" width="294" height="42" rx="8" fill="#d8e9ff"/><text x="923" y="627" class="cap">视图 → 布局：2 / 3 / 4 组</text>
